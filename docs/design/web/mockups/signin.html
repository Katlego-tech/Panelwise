<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Panelwise</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* Sign-in (web.md §4.0). The one screen without the app bar. */
  .signin { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .card { width: min(400px, 100%); background: var(--paper); box-shadow: var(--shadow-page); padding: 32px 28px; border-top: 4px solid var(--line-1); }
  .wordmark { color: var(--ink); font-size: 30px; }
  .card p.lede { margin: 10px 0 24px; color: var(--ink-2); }
  label { display: block; font-weight: 700; font-size: 14px; margin: 14px 0 6px; }
  input { width: 100%; height: 40px; padding: 0 12px; font: 15px var(--font-body); color: var(--ink); background: #fff; border: 1px solid var(--rule); border-radius: var(--radius); }
  input:focus-visible { border-color: var(--pencil); outline: 2px solid var(--pencil-soft); outline-offset: 0; }
  .btn { width: 100%; justify-content: center; margin-top: 22px; height: 42px; }
  .error { margin: 16px 0 0; padding: 10px 12px; font-size: 14px; color: var(--withheld); background: #f7e8e6; border-left: 3px solid var(--withheld); }
</style></head>
<body>
<main class="signin">
  <form class="card" aria-labelledby="t">
    <span class="wordmark" id="t">Panel<span>wise</span></span>
    <p class="lede">Sign in to board your screenplays.</p>
    <label for="email">Email</label><input id="email" type="email" autocomplete="email" value="judge@panelwise.demo">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" value="••••••••••">
    <p class="error" role="alert">That email and password don't match. Check both and try again.</p>
    <button class="btn" type="submit">Sign in</button>
  </form>
</main>
</body></html>

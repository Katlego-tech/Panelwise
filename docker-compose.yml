# Local stack: docker compose up --build --wait
# Versions pinned per PLAN.md § Technical Context. Credentials here are local-dev only.
# Host ports default to the standard ones; override any of them in .env when they are taken.

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: panelwise
      POSTGRES_PASSWORD: panelwise
      POSTGRES_DB: panelwise
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes:
      # Postgres 18 images keep versioned data under /var/lib/postgresql/<major>/.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panelwise -d panelwise"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.2-trixie
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./services/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://panelwise:panelwise@postgres:5432/panelwise
      REDIS_URL: redis://redis:6379/0
    ports: ["${API_HOST_PORT:-8000}:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: ./apps/web
    environment:
      API_URL: http://api:8000
    ports: ["${WEB_HOST_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:

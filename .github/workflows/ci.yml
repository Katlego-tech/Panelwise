# CI -- the backstop for the local pre-push gate.
#
# The local hook is opt-in (core.hooksPath is not cloned) and bypassable (--no-verify),
# so it is the fast feedback loop, not the authority. This is the authority: it runs on
# hardware nobody can configure their way around.
#
# It deliberately runs the SAME scripts/gate.sh the hook runs. Do not add checks here
# that the hook doesn't have -- add them to gate.sh and both get them. A pipeline that
# has drifted from the local gate teaches people to ignore the local gate.
#
# 📝 Customize: the toolchain setup steps below (Python/Node versions) must match what
# PLAN.md's Technical Context pins. Dependencies are installed through gate.sh itself,
# and everything from there on is meant to stay as it is.

name: CI

# Pushes run on main only; a branch gets the gate through its PR. Running on pushes to
# every branch as well ran it twice for each commit on a branch with an open PR -- one run
# for the push, one for the PR, in different concurrency groups, so neither cancelled the other.
on:
  push:
    branches: [main]
    # Not run for changes that only touch files no check reads: the shared-state boards
    # and the AI entry points. README.md and docs/ stay in: .hack/hack.py and the tests
    # read them.
    paths-ignore:
      - 'STATUS.md'
      - 'TASKS.md'
      - 'HANDOFF.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '.claude/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'STATUS.md'
      - 'TASKS.md'
      - 'HANDOFF.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '.claude/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The placeholder sweep needs the commits being introduced, not just the tip.
          fetch-depth: 0

      # --- toolchain -------------------------------------------------------
      # Pinned, not "latest". An unpinned toolchain turns an unrelated upstream
      # release into a red build on a branch that changed nothing. Every action
      # here runs on Node 24; the Node 20 versions they replace are deprecated.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14.7'

      # setup-uv stopped publishing major tags (like @v10) in v8, so it is pinned
      # to a full release. Bump it deliberately; there is no tag that moves for you.
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          # Without this the action installs the newest uv; same version as the API image.
          version: '0.11.32'
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24.21.0'
          # Since v5 this action caches npm dependencies on its own when package.json
          # names npm as the package manager. Not here: the install goes through gate.sh
          # -- keep it that way. "Cache downloads" below caches what the install fetches.
          package-manager-cache: false

      # pnpm and yarn come with Node through corepack; this puts them on PATH, so a
      # project locked with pnpm-lock.yaml or yarn.lock installs and runs with the
      # manager it was locked with. (bun.lockb needs oven-sh/setup-bun -- add it here.)
      - name: Enable pnpm and yarn
        run: corepack enable

      # The gate's vulnerability scan checks every lockfile against the OSV database.
      # A pinned release, verified against its published checksum before it runs.
      - name: Set up osv-scanner
        env:
          OSV_SCANNER_VERSION: v2.5.1
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/google/osv-scanner/releases/download/$OSV_SCANNER_VERSION"
          curl -sSfLO "$base/osv-scanner_linux_amd64"
          curl -sSfLO "$base/osv-scanner_SHA256SUMS"
          grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          install -m 0755 osv-scanner_linux_amd64 "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Find the pnpm store
        id: pnpm-store
        working-directory: apps/web
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Caches what the installs download, never what they install: gate.sh still runs
      # every install, so a hit only means less comes over the network. The key is the
      # lockfile, so a dependency change starts a fresh cache from the nearest old one.
      - name: Cache downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
          key: downloads-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
          restore-keys: downloads-${{ runner.os }}-

      # --- dependencies ----------------------------------------------------
      # gate.sh treats "dependencies not installed" as a failure, so this step is
      # what makes it able to run rather than able to complain. It goes through
      # gate.sh on purpose: the installer walks the same directories and picks the
      # same package manager as the checks do. This used to be a loop here with its
      # own directory list, and CI stopped installing folders the gate still checked.
      - name: Install dependencies
        run: bash scripts/gate.sh --install-deps

      # --- the gate --------------------------------------------------------
      - name: Compute the change set
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            git -c core.quotePath=false diff --name-only --diff-filter=ACM "$base..$head" > /tmp/changed.txt
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$before^{commit}" 2>/dev/null; then
              git -c core.quotePath=false diff --name-only --diff-filter=ACM "$before..${{ github.sha }}" > /tmp/changed.txt
            else
              git -c core.quotePath=false ls-tree -r --name-only "${{ github.sha }}" > /tmp/changed.txt
            fi
          fi
          echo "$(wc -l < /tmp/changed.txt) file(s) in the change set"

      - name: Run the gate
        run: bash scripts/gate.sh --changed-files /tmp/changed.txt

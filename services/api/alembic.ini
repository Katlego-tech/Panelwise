# Alembic: the database migrations (docs/design/deploy.md §6, T009).
# The URL is never written here: env.py reads DATABASE_URL through Settings.
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
# Anchored to this file's folder: Railway's pre-deploy command runs from an unknown directory.
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
